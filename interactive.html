<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunny Lights the Stars — Interactive Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#2a2350; font-family:'Baloo 2','Comic Sans MS','Arial Rounded MT Bold',sans-serif; }
  #wrap { max-width:860px; margin:0 auto; position:relative; background:#2a2350; overflow:hidden; }
  /* stage fills width, 16:9 landscape; top bar overlays on top of video */
  #stage { position:relative; width:100%; aspect-ratio:16/9; background:#1c1638; }
  #stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* top bar overlays video */
  #topbar { position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:linear-gradient(180deg, rgba(20,14,45,.55) 0%, rgba(20,14,45,0) 100%); pointer-events:none; }
  #topbar .mini { display:flex; align-items:center; gap:6px; color:#fff; font-weight:700; font-size:13px; letter-spacing:.3px; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  #topbar .mini img { width:26px; height:26px; border-radius:50%; background:#fff; object-fit:cover; }
  #stars { display:flex; gap:6px; }
  #stars .st { font-size:20px; line-height:1; color:rgba(255,255,255,.22); filter:grayscale(1) brightness(.7); transition:all .5s ease; }
  #stars .st.on { color:#ffc53d; filter:none; text-shadow:0 0 14px rgba(255,197,61,.9),0 0 30px rgba(255,197,61,.5); transform:scale(1.12); }
  /* choice: invisible click zones over baked-in buttons */
  #choice { position:absolute; inset:0; z-index:12; display:none; }
  #choice.show { display:block; }
  #choice .btns { position:absolute; inset:0; }
  #choice .btn { position:absolute; top:79%; width:38.4%; height:18.6%; padding:0; border:0; cursor:pointer; background:transparent; border-radius:clamp(8px,2.5vw,24px); }
  #choice #btnNo { left:6.5%; }
  #choice #btnQuiet { left:55.5%; }
  #choice .btn:hover { outline:2px solid rgba(255,255,255,.7); outline-offset:1px; }
  #choice .btn:focus-visible { outline:3px solid white;outline-offset:3px; }
  #choice .btn:active { background:rgba(255,255,255,.12); }
  /* start overlay */
  #start { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:linear-gradient(180deg,#241d4d 0%, #3a2f6e 60%, #4a3d85 100%); padding:30px; text-align:center; transition:opacity .6s ease; }
  #start.hide { opacity:0; pointer-events:none; }
  #start img.logo { width:36%; max-width:200px; border-radius:24px; box-shadow:0 16px 40px rgba(0,0,0,.35); animation:float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  #start h1 { font-size:clamp(22px,4vw,32px); font-weight:800; color:#ffc53d; text-shadow:0 0 18px rgba(255,197,61,.45), 0 3px 0 #b8821d, 0 5px 12px rgba(0,0,0,.4); letter-spacing:.5px; }
  #start p { font-size:14px; font-weight:600; color:rgba(255,255,255,.85); }
  #goBtn { font-family:inherit; font-weight:800; font-size:clamp(18px,2.8vw,24px); letter-spacing:1px; color:#fff; background:linear-gradient(180deg,#ff8a55,#f06b37); border:3px solid #ffe9b8; border-radius:40px; padding:14px 46px; cursor:pointer; box-shadow:0 10px 0 rgba(0,0,0,.22), 0 10px 26px rgba(240,107,55,.45); transition:transform .12s ease; }
  #goBtn:active { transform:translateY(5px); box-shadow:0 5px 0 rgba(0,0,0,.22); }
  /* end overlay */
  #end { position:absolute; inset:0; z-index:14; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; background:linear-gradient(180deg, rgba(20,14,45,.55) 0%, rgba(20,14,45,.85) 100%); }
  #end.show { display:flex; animation:fadeIn .8s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  #end h1 { font-size:clamp(22px,4vw,32px); font-weight:800; color:#ffc53d; text-shadow:0 0 16px rgba(255,197,61,.5), 0 3px 0 #b8821d; letter-spacing:.5px; }
  #end .tag { font-size:clamp(14px,2.2vw,18px); font-weight:700; color:#fff; }
  #end .stars { display:flex; gap:14px; margin:10px 0; }
  #end .stars .st { font-size:clamp(28px,5vw,44px); color:rgba(255,255,255,.18); filter:grayscale(1) brightness(.6); transition:all .5s ease; }
  #end .stars .st.on { color:#ffc53d; filter:none; text-shadow:0 0 18px rgba(255,197,61,.95),0 0 36px rgba(255,197,61,.55); transform:scale(1.15); }
  #end .meta { font-size:13.5px; font-weight:600; color:rgba(255,255,255,.82); }
  #end .src { font-size:11px; font-weight:600; color:rgba(255,255,255,.55); max-width:320px; line-height:1.5; margin-top:4px; }
  #again { font-family:inherit; font-weight:800; font-size:16px; color:#fff; background:linear-gradient(180deg,#ff8a55,#f06b37); border:3px solid #ffe9b8; border-radius:30px; padding:11px 28px; cursor:pointer; margin-top:10px; box-shadow:0 6px 0 rgba(0,0,0,.22); }
  #again:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.22); }

  button:focus-visible { outline:3px solid #fff;outline-offset:3px; }
  #topbar { pointer-events:none;padding:8px 12px; }
  #topbar .mini { font-size:11px; } #stars { margin-right:110px; }
  #start { gap:10px;padding:18px; } #start img.logo { width:auto;height:30%;max-height:126px;box-shadow:none;animation:none; }
  #start h1 { font-size:clamp(18px,3.4vw,30px); } #start p { font-size:clamp(11px,1.8vw,14px); }
  #goBtn { font-size:18px;padding:9px 30px;min-height:40px; }
  #end { gap:5px;padding:15px; } #end h1 { font-size:clamp(18px,3.4vw,30px); }
  #end .tag { font-size:clamp(11px,1.9vw,16px); } #end .stars { margin:3px 0; }
  #end .meta { font-size:11px; } #end .src { font-size:10px;margin:0; }
  #again { font-size:14px;padding:7px 20px;margin-top:5px;min-height:36px; }
  #controls { position:absolute;top:6px;right:8px;z-index:22;display:none;gap:4px; }
  #controls.show { display:flex; }
  #controls button { background:#201936e6;color:white;border:1px solid #aaa1bb;border-radius:6px;width:32px;height:32px;font-size:14px;cursor:pointer; }
  #status { position:absolute;bottom:4px;left:8px;right:8px;z-index:40;color:white;background:#211a36;font-size:12px;text-align:center; }
  #status:empty { display:none; }
  @media(max-width:500px) {
    #start { padding:10px;gap:6px; } #start img.logo { display:none; }
    #start h1 { font-size:18px; } #start p { font-size:10px;line-height:1.4; } #goBtn { font-size:15px;padding:6px 20px;min-height:36px; }
    #topbar .mini span { display:none; } #topbar .mini img { width:22px;height:22px; }
    #stars .st { font-size:16px; } #end { gap:3px;padding:8px; }
    #end h1 { font-size:17px; } #end .stars .st { font-size:22px; } #end .src { font-size:9px;line-height:1.2; }
    #end .meta { font-size:10px; } #again { font-size:12px;padding:5px 14px;min-height:32px;margin-top:3px; }
  }
  @media(prefers-reduced-motion:reduce) { * {animation:none!important;transition:none!important;} }

#start.hide { display:none; }
@media(max-width:360px) { #end .stars,#end .src { display:none; } #end h1 { font-size:15px;line-height:1.2; } #end .tag { font-size:10px;line-height:1.3; } #end .meta { font-size:9px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <video id="player" playsinline preload="auto" src="assets/final_video.mp4"></video>

    <div id="topbar">
      <div class="mini"><img src="assets/logo_clean.png" alt=""><span>Bunny Lights the Stars</span></div>
      <div id="stars">
        <span class="st" data-i="1">⭐</span>
        <span class="st" data-i="2">⭐</span>
        <span class="st" data-i="3">⭐</span>
      </div>
    </div>

    <div id="controls" aria-label="Playback controls"><button id="pauseBtn" aria-label="Pause story">Ⅱ</button><button id="muteBtn" aria-label="Mute story">♪</button><button id="fullBtn" aria-label="Full screen">⛶</button></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="choice" role="group" aria-label="How could Bunny respond?">
      <div class="btns">
        <button class="btn" id="btnNo" aria-label="Say No"></button>
        <button class="btn" id="btnQuiet" aria-label="Stay Quiet"></button>
      </div>
    </div>

    <div id="end">
      <h1>Bunny Lights the Stars</h1>
      <div class="tag">You can always tell a trusted adult.</div>
      <div class="stars">
        <span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span>
      </div>
      <div class="meta">Watch with a trusted adult · Ages 4+</div>
      <div class="src">Based on the NSW Child Protection Education Curriculum</div>
      <button id="again">Watch Again</button>
    </div>

    <div id="start">
      <img class="logo" src="assets/logo_clean.png" alt="Bunny Lights the Stars">
      <h1>Bunny Lights the Stars</h1>
      <p>Tap to light a star! &nbsp;•&nbsp; Watch with a trusted adult · Ages 4+</p>
      <button id="goBtn">Let's Go!</button>
    </div>
  </div>
</div>

<script>
(function(){
  var player = document.getElementById('player');
  var start = document.getElementById('start');
  var choice = document.getElementById('choice');
  var endCard = document.getElementById('end');
  var starEls = [].slice.call(document.querySelectorAll('#stars .st'));
  var endStars = [].slice.call(document.querySelectorAll('#end .stars .st'));
  var againBtn = document.getElementById('again');

  // Timestamps in the video
  var CHOICE_AT = 33.6;      // choice screen appears
  var NO_VOICE_AT = 41.0;    // "no I don't want this" voice starts
  var TELL_AT = 43.9;        // "tell a grown up" scene starts
  var skipNoVoice = false;   // for Quiet branch: skip the "no I don't want this" voice

  var choiceHandled = false;
  var ended = false;
  var branch = null;

  var controls=document.getElementById('controls');
  var pauseBtn=document.getElementById('pauseBtn'), muteBtn=document.getElementById('muteBtn');
  var status=document.getElementById('status');
  function play(){status.textContent='';return player.play().catch(function(){status.textContent='Press Play to continue.';controls.classList.add('show');});}
  pauseBtn.addEventListener('click',function(){if(player.paused)play();else player.pause();});
  player.addEventListener('play',function(){pauseBtn.textContent='Ⅱ';pauseBtn.setAttribute('aria-label','Pause story');});
  player.addEventListener('pause',function(){pauseBtn.textContent='▶';pauseBtn.setAttribute('aria-label','Play story');});
  muteBtn.addEventListener('click',function(){player.muted=!player.muted;muteBtn.textContent=player.muted?'×':'♪';muteBtn.setAttribute('aria-label',player.muted?'Unmute story':'Mute story');});
  if(!document.fullscreenEnabled){document.getElementById('fullBtn').hidden=true;}
  document.getElementById('fullBtn').addEventListener('click',function(){
    var stage=document.getElementById('stage');
    var request=document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?stage.requestFullscreen():Promise.reject();
    if(request&&request.catch)request.catch(function(){status.textContent='Full screen is unavailable in this browser.';});
  });
  player.addEventListener('error',function(){status.textContent='Video could not load. Keep the assets folder beside the HTML files.';});
  function lightStar(i){
    starEls[i-1].classList.add('on');
    endStars[i-1].classList.add('on');
  }

  function reset(){
    choiceHandled = false;
    ended = false;
    branch = null;
    skipNoVoice = false;
    endCard.classList.remove('show');
    choice.classList.remove('show');
    starEls.forEach(function(s){ s.classList.remove('on'); });
    endStars.forEach(function(s){ s.classList.remove('on'); });
    player.currentTime = 0;
    player.pause();
  }

  player.addEventListener('timeupdate', function(){
    if(ended) return;
    // Light star 1 early
    if(player.currentTime > 2 && !starEls[0].classList.contains('on')){
      lightStar(1);
    }
    // Pause at choice point
    if(!choiceHandled && player.currentTime >= CHOICE_AT){
      player.pause();
      choiceHandled = true;
      choice.classList.add('show');
      controls.classList.remove('show');
      document.getElementById('btnNo').focus({preventScroll:true});
      lightStar(2);
    }
    // Quiet branch: skip past the "no I don't want this" voice
    if(skipNoVoice && player.currentTime >= NO_VOICE_AT && player.currentTime < TELL_AT){
      player.currentTime = TELL_AT;
    }
  });

  player.addEventListener('ended', function(){
    ended = true;
    lightStar(3);
    endCard.classList.add('show');
    controls.classList.remove('show');
    againBtn.focus({preventScroll:true});
  });

  function chooseNo(){
    branch = 'no';
    skipNoVoice = false;
    choice.classList.remove('show');
    controls.classList.add('show');
    // Skip the "yes say it" encouragement, jump straight to "no I don't want this"
    player.currentTime = NO_VOICE_AT;
    play();
  }

  function chooseQuiet(){
    branch = 'quiet';
    skipNoVoice = true;
    choice.classList.remove('show');
    controls.classList.add('show');
    // Continue from after choice screen, play encouragement, skip "no I don't want this"
    play();
  }

  document.getElementById('btnNo').addEventListener('click', chooseNo);
  document.getElementById('btnQuiet').addEventListener('click', chooseQuiet);

  document.getElementById('goBtn').addEventListener('click', function(){
    start.classList.add('hide');
    controls.classList.add('show');
    play();
  });

  againBtn.addEventListener('click', function(){
    reset();
    controls.classList.add('show');
    play();
  });
})();
</script>
</body>
</html>
